spring:
  application:
    name: peervault-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/peervault}
    username: ${DB_USER:peervault}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

coreissuer:
  security:
    pepper: ${COREISSUER_PEPPER}
  cors:
    allowed-origins: ${PEERVAULT_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${PEERVAULT_JWT_SECRET}
    expiration: ${JWT_EXPIRATION_SECONDS:900}
  wallet:
    default-currency: ${DEFAULT_CURRENCY:INR}
    supported-currencies: ${SUPPORTED_CURRENCIES:INR,USD}
  transfers:
    max-amount: ${MAX_TRANSFER_AMOUNT:100000.00}
    velocity-limit: ${TRANSFER_VELOCITY_LIMIT:20}
    velocity-window-seconds: ${TRANSFER_VELOCITY_WINDOW_SECONDS:60}
  payments:
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  admin:
    email: ${PEERVAULT_ADMIN_EMAIL:}
    password: ${PEERVAULT_ADMIN_PASSWORD:}
  webhook:
    # Empty disables webhook deliveries entirely.
    target-url: ${WEBHOOK_TARGET_URL:}
  reconciliation:
    report-dir: ${RECON_REPORT_DIR:reports}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: true

logging:
  level:
    com.coreissuer: INFO
    org.hibernate.SQL: WARN
